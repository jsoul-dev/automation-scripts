name: Auto Update Latest Release

on:
  push:
    branches:
      - main

jobs:
  update-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required to detect changed files

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44

      - name: Upload modified scripts to latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking for modified scripts..."
          
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            # Only process the file if it still exists (wasn't deleted)
            if [ -f "$file" ]; then
              # Check if it has a script extension
              if [[ "$file" == *.bat || "$file" == *.py || "$file" == *.ps1 || "$file" == *.ahk ]]; then
                echo "Uploading updated file: $file"
                gh release upload latest "$file" --clobber
              fi
            fi
          done
          
          echo "Upload complete!"
